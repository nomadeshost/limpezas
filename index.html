<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#011126">
<title>Limpezas · Nômades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --noite: #011126;
    --profundo: #023059;
    --roxo: #6f6da6;
    --laranja: #f27405;
    --amarelo: #fcb229;
    --areia: #e8e4dd;
    --areia-clara: #f4f1e9;
    --branco: #ffffff;
    --texto: #011126;
    --suave: rgba(2, 48, 89, 0.68);
    --linha: #e8e4dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--areia-clara);
    color: var(--texto);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  /* ---------- topo ---------- */
  .topo {
    background: var(--noite);
    color: var(--areia);
    padding: calc(18px + env(safe-area-inset-top)) 16px 0;
    position: relative;
    overflow: hidden;
  }
  .topo .marca-dagua {
    position: absolute; right: -60px; top: -30px;
    width: 240px; color: #0a2140; pointer-events: none;
  }
  .topo-linha {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 640px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 34px; height: auto; color: var(--roxo); flex-shrink: 0; }
  .logo-texto { display: flex; flex-direction: column; }
  .logo-nome { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px; color: var(--amarelo); line-height: 1; }
  .logo-sub { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--areia); opacity: 0.8; margin-top: 4px; }
  .btn-atualizar {
    background: var(--amarelo); color: var(--noite); border: 0;
    border-radius: 999px; padding: 10px 16px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-atualizar:disabled { opacity: 0.6; }
  .btn-atualizar svg { width: 14px; height: 14px; }
  .girando svg { animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .atualizado {
    position: relative; max-width: 640px; margin: 14px auto 0;
    font-size: 13px; color: var(--areia); opacity: 0.75;
  }

  /* ---------- dias ---------- */
  .dias {
    position: relative;
    display: flex; gap: 8px; overflow-x: auto;
    max-width: 640px; margin: 14px auto 0;
    padding: 0 0 16px;
    scrollbar-width: none;
  }
  .dias::-webkit-scrollbar { display: none; }
  .dia-chip {
    flex: 0 0 auto;
    min-width: 58px;
    background: transparent; color: var(--areia);
    border: 1px solid rgba(232, 228, 221, 0.25);
    border-radius: 999px;
    padding: 8px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .dia-chip .sem { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
  .dia-chip .num { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 17px; }
  .dia-chip .qtd {
    font-size: 11px; font-weight: 700;
    min-width: 20px; padding: 0 6px; border-radius: 999px;
    background: rgba(232, 228, 221, 0.15);
  }
  .dia-chip.tem .qtd { background: var(--amarelo); color: var(--noite); }
  .dia-chip.ativo { background: var(--areia); color: var(--noite); border-color: var(--areia); }
  .dia-chip.ativo .qtd { background: var(--noite); color: var(--amarelo); }

  /* ---------- conteúdo ---------- */
  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }
  .dia { padding-top: 20px; scroll-margin-top: 8px; }
  .dia-titulo {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 12px;
  }
  .dia-titulo h2 {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px;
    color: var(--profundo); line-height: 1.2;
  }
  .dia-titulo h2 small { font-weight: 500; color: var(--suave); font-size: 16px; }
  .dia-titulo .conta { font-size: 13px; color: var(--suave); white-space: nowrap; }
  .vazio {
    border: 1px dashed #cfc9bf; padding: 16px; color: var(--suave); font-size: 14px;
  }

  .card {
    background: var(--branco);
    border: 1px solid var(--linha);
    border-left: 5px solid var(--profundo);
    margin-bottom: 12px;
  }
  .card.critico { border-left-color: var(--laranja); }
  .card.feito { border-left-color: var(--roxo); opacity: 0.62; }
  .card-topo { padding: 14px 16px 0; }
  .horario-linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; line-height: 1.2;
  }
  .tag-hora { background: var(--profundo); color: var(--areia); }
  .tag-hora.prazo { background: var(--areia); color: var(--profundo); }
  .tag-prioridade { background: var(--laranja); color: var(--branco); }
  .tag-feito { background: var(--roxo); color: var(--branco); }
  .ressalva { font-size: 13px; color: var(--suave); width: 100%; }
  .imovel {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 24px;
    color: var(--profundo); line-height: 1.15;
  }
  .endereco { font-size: 14px; color: var(--suave); margin-top: 4px; }
  .endereco a { color: var(--profundo); font-weight: 700; text-decoration: none; white-space: nowrap; }
  .endereco a::after { content: " ↗"; }

  .bloco { padding: 12px 16px; border-top: 1px solid var(--linha); margin-top: 12px; }
  .bloco + .bloco { margin-top: 0; }
  .bloco-rotulo {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--suave); margin-bottom: 6px;
  }
  .kits { list-style: none; display: grid; gap: 6px; }
  .kits li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  .kits .qt {
    flex-shrink: 0; min-width: 28px; height: 28px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px;
    background: var(--profundo); color: var(--areia);
  }
  .kits .armario .qt { background: var(--areia); color: var(--profundo); }
  .kits b { font-weight: 700; }
  .kits .det { display: block; font-size: 13px; color: var(--suave); }
  .hospedes { margin-top: 8px; font-size: 14px; color: var(--profundo); font-weight: 600; }

  .acesso { font-size: 14px; display: grid; gap: 4px; }
  .acesso a { color: var(--profundo); font-weight: 700; }
  .senha { font-family: 'Outfit', sans-serif; font-weight: 700; letter-spacing: 0.05em; }

  .avisos { list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .avisos li { padding-left: 24px; position: relative; }
  .avisos li::before { content: "⚠️"; position: absolute; left: 0; top: 0; font-size: 14px; }
  .avisos li.dica::before { content: "📍"; }
  .avisos li.recado { font-weight: 700; color: var(--profundo); }

  .checklist { list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .checklist label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .checklist input { width: 20px; height: 20px; accent-color: var(--profundo); flex-shrink: 0; margin-top: 1px; }

  /* ---------- rodapé, estados ---------- */
  .rodape {
    max-width: 640px; margin: 0 auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--linha); font-size: 14px; color: var(--suave);
  }
  .rodape p + p { margin-top: 6px; }
  .rodape a { color: var(--profundo); font-weight: 700; text-decoration: none; }
  .tagline { margin-top: 18px; font-size: 11px; letter-spacing: 0.18em; color: var(--laranja); text-transform: uppercase; }
  .estado { text-align: center; padding: 48px 16px; color: var(--suave); }
  .estado h2 { font-family: 'Outfit', sans-serif; color: var(--profundo); font-size: 20px; margin-bottom: 8px; }
  .aviso-amostra {
    background: var(--amarelo); color: var(--noite); font-size: 13px; font-weight: 600;
    padding: 8px 16px; text-align: center;
  }
  .pin { max-width: 320px; margin: 48px auto; text-align: center; padding: 0 16px; }
  .pin h2 { font-family: 'Outfit', sans-serif; color: var(--profundo); margin-bottom: 8px; }
  .pin input {
    width: 100%; font-size: 28px; text-align: center; letter-spacing: 0.3em;
    padding: 12px; border: 2px solid var(--profundo); background: var(--branco); margin: 16px 0 12px;
    font-family: 'Outfit', sans-serif;
  }
  .pin button {
    width: 100%; background: var(--profundo); color: var(--areia); border: 0; border-radius: 999px;
    padding: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 13px;
  }
  .pin .erro { color: var(--laranja); font-weight: 700; font-size: 14px; min-height: 20px; }
</style>
</head>

/* =====================================================================
   CONFIGURAÇÃO
   A lista de IMÓVEIS (apelido, endereço, camas, notas) fica em Code.gs,

// Endereço da "ponte" (Apps Script) que entrega os dados da planilha.

var IMOVEIS = {};

var JANELA_KITS = 7;

/* =====================================================================
   REGRAS — espelham a skill gerar-cronograma-de-limpezas
   ===================================================================== */

function normalizar(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function acharImovel(nome) {
  if (IMOVEIS[nome]) return IMOVEIS[nome];
  var n = normalizar(nome);
  for (var k in IMOVEIS) if (normalizar(k) === n) return IMOVEIS[k];
  // Imóvel novo, ainda não configurado aqui: aparece com o nome da planilha.
  return { apelido: nome, chave: [], endereco: '', bairro: '', camas: [1, 0, 0], kit: 'fixas', notas: [] };
}

function acharAnuncio(imovel, anuncios) {
  if (!imovel.chave.length) return null;
  for (var i = 0; i < anuncios.length; i++) {
    var end = normalizar(anuncios[i].endereco);
    var ok = imovel.chave.every(function (c) { return end.indexOf(c) !== -1; });
    if (ok) return anuncios[i];
  }
  return null;
}

function diasEntre(a, b) {
  return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000);
}

function minutos(hhmm) {
  if (!hhmm) return null;
  var p = hhmm.split(':');
  return Number(p[0]) * 60 + Number(p[1] || 0);
}

function horaCurta(hhmm) {
  var p = hhmm.split(':');
  var h = String(Number(p[0]));
  return p[1] && p[1] !== '00' ? h + 'h' + p[1] : h + 'h';
}

function kit(n, tipo) {
  var nome = tipo === 'casal'
    ? (n === 1 ? 'Kit Casal' : 'Kits Casal')
    : (n === 1 ? 'Kit Solteiro' : 'Kits Solteiros');
  return { qt: n, nome: nome };
}

/** Kits a montar e a guardar, segundo a regra de ouro:
 *  cama fixa se monta; cama auxiliar e sofá-cama não — o kit fica no armário.
 *  Sofá-cama usa Kit CASAL; cama de solteiro (fixa ou auxiliar) usa Kit Solteiro. */
function calcularKits(imovel, camas, proxima) {
  var casal = camas[0], solteiro = camas[1], sofa = camas[2];
  var montar = [], guardar = [];
  var usaProxima = !!proxima;

  // Kit Casal montado nunca passa das camas de casal fixas; o do sofá-cama é à parte.
  var nCasal = usaProxima && proxima.kitCasal != null ? Math.min(proxima.kitCasal, casal) : casal;
  if (nCasal > 0) montar.push(kit(nCasal, 'casal'));

  var pedidoSolteiro = usaProxima && proxima.kitSolteiro != null ? proxima.kitSolteiro : null;

  if (imovel.kit === 'sofaArmario') {
    guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
  } else if (imovel.kit === 'pedro') {
    // Pedro Américo: 1 casal + sofá-cama. Monta o sofá quando a cama de casal não comporta todos.
    if (usaProxima && proxima.hospedes > 2) {
      montar.push(Object.assign(kit(1, 'casal'), { det: 'No sofá-cama — os próximos hóspedes vão usar' }));
    } else {
      guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
    }
  } else if (imovel.kit === 'bicama') {
    // Porto Carioca 2303: as duas de solteiro são bicama (uma dentro da outra).
    var nb = pedidoSolteiro == null ? 1 : Math.min(pedidoSolteiro, 2);
    if (nb > 0) montar.push(Object.assign(kit(nb, 'solteiro'), {
      det: nb === 1 ? 'Só a cama de cima da bicama' : 'As duas camas da bicama'
    }));
    if (nb < 2) guardar.push(Object.assign(kit(1, 'solteiro'), { det: 'Para o caso de virem 4 hóspedes' }));
  } else {
    var ns = pedidoSolteiro == null ? solteiro : Math.min(pedidoSolteiro, solteiro);
    if (ns > 0) montar.push(kit(ns, 'solteiro'));
    if (sofa > 0) guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
  }
  return { montar: montar, guardar: guardar, hospedes: usaProxima ? proxima.hospedes : null };
}

function montarCronograma(dados) {
  var hoje = dados.hoje;
  var dias = [];
  for (var i = 0; i <= 7; i++) dias.push({ data: somar(hoje, i), limpezas: [] });

  dados.checkouts.forEach(function (co) {
    var imovel = acharImovel(co.anuncio);
    var anuncio = acharAnuncio(imovel, dados.anuncios || []);

    var camas = imovel.camas.slice();
    if (anuncio && anuncio.camasCasal != null) {
      camas = [anuncio.camasCasal, anuncio.camasSolteiro || 0, anuncio.sofas || 0];
    }

    // Próxima entrada no mesmo imóvel a partir do dia da saída.
    var proxima = dados.checkins
      .filter(function (ci) { return normalizar(ci.anuncio) === normalizar(co.anuncio) && ci.data >= co.data; })
      .sort(function (a, b) { return (a.data + a.horario).localeCompare(b.data + b.horario); })[0] || null;
    var proximaNaJanela = proxima && diasEntre(co.data, proxima.data) <= JANELA_KITS ? proxima : null;
    var entradaMesmoDia = proxima && proxima.data === co.data ? proxima : null;

    // Horário: início ou prazo.
    var saida = co.horario || '11:00';
    var hora, prazo = false, ressalva = '';
    if (co.combinado) {
      hora = co.combinado;
    } else if (minutos(saida) < minutos('11:00')) {
      hora = 'a partir das ' + horaCurta(saida);
      ressalva = 'Hóspede sai cedo — confirmar na manhã do dia';
    } else if (entradaMesmoDia || minutos(saida) > minutos('11:00')) {
      hora = 'a partir das ' + horaCurta(saida);
    } else {
      hora = 'até as 15h';
      prazo = true;
    }

    var avisos = [];
    if (co.recado) avisos.push({ texto: co.recado, tipo: 'recado' });
    imovel.notas.forEach(function (n) { avisos.push({ texto: n }); });
    if (anuncio && anuncio.observacoes) {
      var jaTem = imovel.notas.some(function (n) { return normalizar(n).indexOf(normalizar(anuncio.observacoes)) !== -1; });
      if (!jaTem) avisos.push({ texto: anuncio.observacoes });
    }

    var dia = dias.filter(function (d) { return d.data === co.data; })[0];
    if (!dia) return;
    dia.limpezas.push({
      nomePlanilha: co.anuncio,
      imovel: imovel,
      anuncio: anuncio,
      hora: hora,
      prazo: prazo,
      ressalva: ressalva,
      prioridade: entradaMesmoDia ? 'Entrada às ' + horaCurta(entradaMesmoDia.horario || '15:00') : '',
      entradaMin: entradaMesmoDia ? minutos(entradaMesmoDia.horario || '15:00') : 9999,
      feito: co.limpezaRealizada === 'OK',
      kits: calcularKits(imovel, camas, proximaNaJanela),
      avisos: avisos
    });
  });

  // Mesma rua no mesmo dia = uma viagem só.
  dias.forEach(function (d) {
    d.limpezas.sort(function (a, b) { return a.entradaMin - b.entradaMin; });
    var mesmaRua = d.limpezas.filter(function (l) { return l.imovel.rua === 'milton-santos'; });
    if (mesmaRua.length > 1) {
      mesmaRua.forEach(function (l) {
        var outros = mesmaRua.filter(function (o) { return o !== l; }).map(function (o) { return o.imovel.apelido; });
        l.avisos.push({ texto: 'Mesma rua de ' + juntar(outros) + ' — dá pra fazer na mesma ida.', tipo: 'dica' });
      });
    }
  });
  return dias;
}

function juntar(lista) {
  if (lista.length < 2) return lista.join('');
  return lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
}

function somar(iso, n) {
  var p = iso.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}

/* =====================================================================
   TELA
   ===================================================================== */

var SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
var SEMANA_CURTA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

function diaSemana(iso) { return new Date(iso + 'T12:00:00Z').getUTCDay(); }
function ddmm(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function telefoneLink(txt) {
  // "Portaria: (21) 3597-9383" → link tel: mantendo o texto.
  return esc(txt).replace(/\(?\d{2}\)?\s?\d{4,5}-?\d{4}/g, function (num) {
    var d = num.replace(/\D/g, '');
    return '<a href="tel:+55' + d + '">' + num + '</a>';
  });
}

function mapaLink(end) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(end + ', Rio de Janeiro - RJ');
}

function renderizar(dados) {
  var dias = montarCronograma(dados);
  var hoje = dados.hoje;

  var g = dados.geradoEm || '';
  document.getElementById('atualizado').textContent =
    'Atualizado em ' + ddmm(g.slice(0, 10)) + ' às ' + g.slice(11, 16) + ' · puxa direto da planilha';

  document.getElementById('dias').innerHTML = dias.map(function (d, i) {
    var n = d.limpezas.filter(function (l) { return !l.feito; }).length;
    var rot = i === 0 ? 'hoje' : SEMANA_CURTA[diaSemana(d.data)];
    return '<button type="button" class="dia-chip' + (n ? ' tem' : '') + (i === 0 ? ' ativo' : '') +
      '" data-alvo="dia-' + d.data + '"><span class="sem">' + rot + '</span><span class="num">' +
      d.data.slice(8, 10) + '</span><span class="qtd">' + n + '</span></button>';
  }).join('');

  document.getElementById('conteudo').innerHTML = dias.map(function (d, i) {
    var rotulo = i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : cap(SEMANA[diaSemana(d.data)]);
    var sub = (i <= 1 ? SEMANA[diaSemana(d.data)] + ', ' : '') + ddmm(d.data);
    var n = d.limpezas.length;
    var corpo = n ? d.limpezas.map(cartao).join('') : '<div class="vazio">Nenhuma limpeza neste dia.</div>';
    return '<section class="dia" id="dia-' + d.data + '"><div class="dia-titulo"><h2>' + rotulo +
      ' <small>· ' + sub + '</small></h2><span class="conta">' + (n ? n + (n === 1 ? ' limpeza' : ' limpezas') : '') +
      '</span></div>' + corpo + '</section>';
  }).join('');

  ligarChips();
  restaurarChecklist();
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function cartao(l) {
  var im = l.imovel, an = l.anuncio;
  var endereco = im.endereco || (an && an.endereco) || '';
  var bairro = (an && an.bairro) || im.bairro;
  var classes = 'card' + (l.feito ? ' feito' : l.prioridade ? ' critico' : '');

  var tags = '<span class="tag tag-hora' + (l.prazo ? ' prazo' : '') + '">' + esc(l.hora) + '</span>';
  if (l.feito) tags += '<span class="tag tag-feito">✓ Feita</span>';
  else if (l.prioridade) tags += '<span class="tag tag-prioridade">⚠️ ' + esc(l.prioridade) + '</span>';
  if (l.ressalva) tags += '<span class="ressalva">' + esc(l.ressalva) + '</span>';

  var h = '<article class="' + classes + '"><div class="card-topo"><div class="horario-linha">' + tags + '</div>' +
    '<div class="imovel">' + esc(im.apelido) + '</div>' +
    '<div class="endereco">' + esc(endereco) + (bairro ? ' · ' + esc(bairro) : '') +
    (endereco ? ' &nbsp;<a href="' + mapaLink(endereco) + '" target="_blank" rel="noopener">Mapa</a>' : '') +
    '</div></div>';

  // Enxoval
  var k = l.kits;
  var itens = k.montar.map(function (x) {
    return '<li><span class="qt">' + x.qt + '</span><span><b>' + esc(x.nome) + '</b> — montar' +
      (x.det ? '<span class="det">' + esc(x.det) + '</span>' : '') + '</span></li>';
  }).concat(k.guardar.map(function (x) {
    return '<li class="armario"><span class="qt">' + x.qt + '</span><span><b>' + esc(x.nome) + '</b> — guardado no armário' +
      (x.det ? '<span class="det">' + esc(x.det) + '</span>' : '') + '</span></li>';
  }));
  h += '<div class="bloco"><div class="bloco-rotulo">🧺 Enxoval a deixar</div><ul class="kits">' + itens.join('') + '</ul>' +
    (k.hospedes ? '<div class="hospedes">Próxima reserva: ' + k.hospedes + (k.hospedes === 1 ? ' hóspede' : ' hóspedes') + '</div>' : '') +
    '</div>';

  // Acesso
  if (an) {
    var linhas = [];
    if (an.tipoAcesso) linhas.push('<div>🔑 ' + esc(an.tipoAcesso) + (an.condominio && an.condominio !== 'N/A' ? ' · ' + esc(an.condominio) : '') + '</div>');
    if (an.senha && an.senha !== '-') linhas.push('<div>Senha: <span class="senha">' + esc(an.senha) + '</span></div>');
    if (an.portaria && an.portaria !== 'N/A') linhas.push('<div>☎️ ' + telefoneLink(an.portaria) + '</div>');
    if (linhas.length) h += '<div class="bloco"><div class="bloco-rotulo">Acesso</div><div class="acesso">' + linhas.join('') + '</div></div>';
  }

  // Atenção
  if (l.avisos.length) {
    h += '<div class="bloco"><div class="bloco-rotulo">Atenção</div><ul class="avisos">' +
      l.avisos.map(function (a) { return '<li' + (a.tipo ? ' class="' + a.tipo + '"' : '') + '>' + esc(a.texto) + '</li>'; }).join('') +
      '</ul></div>';
  }

  // Checklist (fica salvo só neste celular)
  if (!l.feito) {
    h += '<div class="bloco"><div class="bloco-rotulo">Antes de sair</div><ul class="checklist">' +
      CHECKLIST_GERAL.map(function (c, i) {
        var id = 'ck|' + l.nomePlanilha + '|' + i;
        return '<li><label><input type="checkbox" data-ck="' + esc(id) + '"> ' + esc(c) + '</label></li>';
      }).join('') + '</ul></div>';
  }
  return h + '</article>';
}

/* ---------- interações ---------- */

function ligarChips() {
  var chips = document.querySelectorAll('.dia-chip');
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      chips.forEach(function (x) { x.classList.remove('ativo'); });
      c.classList.add('ativo');
      var alvo = document.getElementById(c.getAttribute('data-alvo'));
      if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function guardar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) {} }
function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }
function apagar(chave) { try { localStorage.removeItem(chave); } catch (e) {} }

function restaurarChecklist() {
  document.querySelectorAll('[data-ck]').forEach(function (el) {
    var id = el.getAttribute('data-ck') + '|' + DADOS_HOJE;
    el.checked = ler(id) === '1';
    el.addEventListener('change', function () { el.checked ? guardar(id, '1') : apagar(id); });
  });
}

/* ---------- carregar ---------- */

var PREVIA_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:';
var DADOS_HOJE = '';

function mostrarErro(msg) {
  document.getElementById('conteudo').innerHTML =
    '<div class="estado"><h2>Não deu pra carregar</h2><p>' + esc(msg) +
    '</p><p style="margin-top:8px">Tenta de novo no botão Atualizar. Se continuar, avisa o Joca ou a Julia.</p></div>';
  document.getElementById('atualizado').textContent = 'Sem conexão com a planilha';
}

function pedirPin(erro) {
  document.getElementById('dias').innerHTML = '';
  document.getElementById('atualizado').textContent = 'Acesso da equipe';
  document.getElementById('conteudo').innerHTML =
    '<form class="pin" id="formPin"><h2>Digite o PIN da equipe</h2>' +
    '<input id="campoPin" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">' +
    '<div class="erro">' + (erro ? 'PIN errado. Tenta de novo.' : '') + '</div>' +
    '<button type="submit">Entrar</button></form>';
  var campo = document.getElementById('campoPin');
  campo.focus();
  document.getElementById('formPin').addEventListener('submit', function (e) {
    e.preventDefault();
    guardar('nomades-pin', campo.value.trim());
    carregar();
  });
}

function receber(dados) {
  var btn = document.getElementById('btnAtualizar');
  btn.disabled = false; btn.classList.remove('girando');
  if (dados && dados.erro === 'PIN') { apagar('nomades-pin'); pedirPin(ler('nomades-pin-tentou') === '1'); guardar('nomades-pin-tentou', '1'); return; }
  apagar('nomades-pin-tentou');
  if (dados.erro) { mostrarErro(dados.mensagem || dados.erro); return; }
  if (dados.imoveis) IMOVEIS = dados.imoveis;
  DADOS_HOJE = dados.hoje;
  try { renderizar(dados); } catch (e) { mostrarErro(e.message); }
}

function carregar() {
  var btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.classList.add('girando');

  if (!PREVIA_LOCAL) {
    // text/plain evita a checagem extra de CORS; o Apps Script lê o corpo cru.
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: ler('nomades-pin') || '' }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status); return r.json(); })
      .then(receber)
      .catch(function (e) { btn.disabled = false; btn.classList.remove('girando'); mostrarErro(e && e.message || String(e)); });
    return;
  }

  // Prévia no computador (localhost): usa dados de exemplo.
  var s = document.createElement('script');
  s.src = 'amostra.js';
  s.onload = function () {
    document.getElementById('avisoAmostra').innerHTML =
      '<div class="aviso-amostra">Prévia com dados de exemplo — no link publicado, os dados vêm da planilha.</div>';
    setTimeout(function () { receber(window.AMOSTRA()); }, 300);
  };
  s.onerror = function () { mostrarErro('Arquivo de exemplo não encontrado.'); };
  document.body.appendChild(s);
}

document.getElementById('btnAtualizar').addEventListener('click', carregar);
carregar();
</script>
