<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#011126">
<title>Limpezas · Nômades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --noite: #011126;
    --profundo: #023059;
    --roxo: #6f6da6;
    --laranja: #f27405;
    --amarelo: #fcb229;
    --areia: #e8e4dd;
    --areia-clara: #f4f1e9;
    --branco: #ffffff;
    --texto: #011126;
    --suave: rgba(2, 48, 89, 0.68);
    --linha: #e8e4dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--areia-clara);
    color: var(--texto);
    font-family: 'Manrope', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  /* ---------- topo ---------- */
  .topo {
    background: var(--noite);
    color: var(--areia);
    padding: calc(18px + env(safe-area-inset-top)) 16px 0;
    position: relative;
    overflow: hidden;
  }
  .topo .marca-dagua {
    position: absolute; right: -60px; top: -30px;
    width: 240px; color: #0a2140; pointer-events: none;
  }
  .topo-linha {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 640px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 34px; height: auto; color: var(--roxo); flex-shrink: 0; }
  .logo-texto { display: flex; flex-direction: column; }
  .logo-nome { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 22px; color: var(--amarelo); line-height: 1; }
  .logo-sub { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--areia); opacity: 0.8; margin-top: 4px; }
  .btn-atualizar {
    background: var(--amarelo); color: var(--noite); border: 0;
    border-radius: 999px; padding: 10px 16px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-atualizar:disabled { opacity: 0.6; }
  .btn-atualizar svg { width: 14px; height: 14px; }
  .girando svg { animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .atualizado {
    position: relative; max-width: 640px; margin: 14px auto 0;
    font-size: 13px; color: var(--areia); opacity: 0.75;
  }

  /* ---------- dias ---------- */
  .dias {
    position: relative;
    display: flex; gap: 8px; overflow-x: auto;
    max-width: 640px; margin: 14px auto 0;
    padding: 0 0 16px;
    scrollbar-width: none;
  }
  .dias::-webkit-scrollbar { display: none; }
  .dia-chip {
    flex: 0 0 auto;
    min-width: 58px;
    background: transparent; color: var(--areia);
    border: 1px solid rgba(232, 228, 221, 0.25);
    border-radius: 999px;
    padding: 8px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .dia-chip .sem { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8; }
  .dia-chip .num { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 17px; }
  .dia-chip .qtd {
    font-size: 11px; font-weight: 700;
    min-width: 20px; padding: 0 6px; border-radius: 999px;
    background: rgba(232, 228, 221, 0.15);
  }
  .dia-chip.tem .qtd { background: var(--amarelo); color: var(--noite); }
  .dia-chip.ativo { background: var(--areia); color: var(--noite); border-color: var(--areia); }
  .dia-chip.ativo .qtd { background: var(--noite); color: var(--amarelo); }

  /* ---------- conteúdo ---------- */
  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 40px; }
  .dia { padding-top: 20px; scroll-margin-top: 8px; }
  .dia-titulo {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 12px;
  }
  .dia-titulo h2 {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px;
    color: var(--profundo); line-height: 1.2;
  }
  .dia-titulo h2 small { font-weight: 500; color: var(--suave); font-size: 16px; }
  .dia-titulo .conta { font-size: 13px; color: var(--suave); white-space: nowrap; }
  .vazio {
    border: 1px dashed #cfc9bf; padding: 16px; color: var(--suave); font-size: 14px;
  }

  .card {
    background: var(--branco);
    border: 1px solid var(--linha);
    border-left: 5px solid var(--profundo);
    margin-bottom: 12px;
  }
  .card.critico { border-left-color: var(--laranja); }
  .card.feito { border-left-color: var(--roxo); }
  .card.feito .card-topo, .card.feito > .bloco { opacity: 0.62; }
  .card-topo { padding: 14px 16px 0; }
  .horario-linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; line-height: 1.2;
  }
  .tag-hora { background: var(--profundo); color: var(--areia); }
  .tag-hora.prazo { background: var(--areia); color: var(--profundo); }
  .tag-prioridade { background: var(--laranja); color: var(--branco); }
  .tag-feito { background: var(--roxo); color: var(--branco); }
  .ressalva { font-size: 13px; color: var(--suave); width: 100%; }
  .imovel {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 24px;
    color: var(--profundo); line-height: 1.15;
  }
  .endereco { font-size: 14px; color: var(--suave); margin-top: 4px; }
  .endereco a { color: var(--profundo); font-weight: 700; text-decoration: none; white-space: nowrap; }
  .endereco a::after { content: " ↗"; }

  .bloco { padding: 12px 16px; border-top: 1px solid var(--linha); margin-top: 12px; }
  .bloco + .bloco { margin-top: 0; }
  .bloco-rotulo {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--suave); margin-bottom: 6px;
  }
  .kits { list-style: none; display: grid; gap: 6px; }
  .kits li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  .kits .qt {
    flex-shrink: 0; min-width: 28px; height: 28px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px;
    background: var(--profundo); color: var(--areia);
  }
  .kits .armario .qt { background: var(--areia); color: var(--profundo); }
  .kits b { font-weight: 700; }
  .kits .det { display: block; font-size: 13px; color: var(--suave); }
  .hospedes { margin-top: 8px; font-size: 14px; color: var(--profundo); font-weight: 600; }

  .acesso { font-size: 14px; display: grid; gap: 4px; }
  .acesso a { color: var(--profundo); font-weight: 700; }

  .avisos { list-style: none; display: grid; gap: 6px; font-size: 14px; }
  .avisos li { padding-left: 24px; position: relative; }
  .avisos li::before { content: "⚠️"; position: absolute; left: 0; top: 0; font-size: 14px; }
  .avisos li.dica::before { content: "📍"; }
  .avisos li.recado { font-weight: 700; color: var(--profundo); }

  /* ---------- checklist da limpeza ---------- */
  .ck { border-top: 1px solid var(--linha); margin-top: 12px; }
  .ck > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; font-weight: 700; color: var(--profundo);
  }
  .ck > summary::-webkit-details-marker { display: none; }
  .ck > summary::after { content: "▾"; font-size: 14px; transition: transform .2s; }
  .ck[open] > summary::after { transform: rotate(180deg); }
  .ck-titulo { display: flex; align-items: center; gap: 8px; }
  .ck-resumo { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--suave); white-space: nowrap; }
  .ck-corpo { padding: 0 16px 16px; }
  .ck-carregando { font-size: 14px; color: var(--suave); padding: 4px 0 8px; }
  .ck-barra { height: 5px; background: var(--linha); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .ck-barra i { display: block; height: 100%; background: var(--amarelo); transition: width .25s; }
  @media (prefers-reduced-motion: reduce) { .ck-barra i, .ck > summary::after { transition: none; } }

  .ck-sec { margin-top: 18px; }
  .ck-sec h3 {
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 17px; color: var(--profundo);
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .ck-sec h3 .n {
    flex: 0 0 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor;
    display: inline-grid; place-items: center; font-size: 12px;
  }
  .ck-sec.completa h3 .n { background: var(--profundo); color: var(--areia); border-color: var(--profundo); }
  .ck-sub { font-size: 13px; color: var(--suave); margin-bottom: 4px; }
  .ck-itens { list-style: none; }
  .ck-itens li { border-bottom: 1px solid var(--linha); }
  .ck-itens label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; font-size: 15px; }
  .ck-itens input { width: 22px; height: 22px; accent-color: var(--profundo); flex-shrink: 0; margin-top: 1px; }
  .ck-itens input:checked + span { color: var(--suave); text-decoration: line-through; }
  .ck-itens em { display: block; font-style: normal; font-size: 13px; color: var(--suave); }

  /* antes/depois: o bloco que não pode passar batido */
  .ck-sec.escuro {
    background: var(--noite); color: var(--areia); border-left: 6px solid var(--amarelo);
    padding: 14px 14px 10px; margin-left: -16px; margin-right: -16px;
  }
  .ck-sec.escuro h3 { color: var(--areia); }
  .ck-sec.escuro h3 .n { color: var(--amarelo); }
  .ck-sec.escuro.completa h3 .n { background: var(--amarelo); color: var(--noite); border-color: var(--amarelo); }
  .ck-sec.escuro .ck-sub, .ck-sec.escuro .ck-itens em { color: #c8cfdb; }
  .ck-sec.escuro .ck-itens li { border-color: rgba(232, 228, 221, .18); }
  .ck-sec.escuro .ck-itens input { accent-color: var(--amarelo); }
  .ck-sec.escuro .ck-itens input:checked + span { color: #aeb7c7; }
  .obrig { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--amarelo); letter-spacing: .06em; text-transform: uppercase; }
  .obrig b { width: 9px; height: 9px; border-radius: 50%; background: #e5372b; }

  .fotos { margin-top: 10px; }
  .fotos-rotulo { font-size: 14px; font-weight: 700; }
  .fotos-dica { font-size: 13px; opacity: .8; margin-bottom: 8px; }
  .fotos-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .foto { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: rgba(127, 127, 127, .2); }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto .st {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: rgba(1, 17, 38, .55); color: #fff; font-size: 11px; font-weight: 700; padding: 4px;
  }
  .foto .st.erro { background: rgba(179, 38, 30, .8); }
  .foto .x {
    position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(1, 17, 38, .75); color: #fff; font-size: 15px; line-height: 1;
  }
  .btn-foto {
    aspect-ratio: 1; border-radius: 8px; border: 2px dashed currentColor; opacity: .85;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .btn-foto span { font-size: 22px; line-height: 1; }
  .btn-foto input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .btn-foto:focus-within { outline: 3px solid var(--roxo); outline-offset: 2px; }

  .dica-ins { font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .ins { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 15px; }
  .seg { display: flex; border: 1.5px solid var(--linha); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--branco); padding: 8px 8px; font-size: 13px; font-weight: 700; min-width: 58px; color: var(--profundo); }
  .seg button + button { border-left: 1.5px solid var(--linha); }
  .seg button[aria-pressed="true"][data-v="ok"] { background: #1f7a4d; color: #fff; }
  .seg button[aria-pressed="true"][data-v="baixo"] { background: var(--amarelo); color: var(--noite); }
  .seg button[aria-pressed="true"][data-v="acabou"] { background: #b3261e; color: #fff; }
  @media (max-width: 380px) { .ins { grid-template-columns: 1fr; } .seg button { flex: 1; } }
  .ck textarea {
    width: 100%; font: inherit; font-size: 15px; padding: 10px; margin-top: 12px;
    border: 1.5px solid var(--linha); border-radius: 8px; background: var(--areia-clara); color: var(--texto);
  }
  .ck label.rot { display: block; font-size: 13px; font-weight: 700; color: var(--suave); margin-top: 14px; }

  .ck-fim { margin-top: 22px; padding-top: 14px; border-top: 2px solid var(--profundo); }
  .ck-fim h3 { font-family: 'Outfit', sans-serif; font-size: 18px; color: var(--profundo); }
  .falta { color: #b3261e; font-size: 14px; font-weight: 600; margin-top: 6px; }
  pre.msg {
    white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 14px;
    background: var(--areia-clara); border: 1px solid var(--linha); border-radius: 8px; padding: 12px; margin: 10px 0;
  }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acoes .btn {
    display: flex; justify-content: center; align-items: center; text-align: center; text-decoration: none;
    border: 0; border-radius: 999px; padding: 12px; font-weight: 700; font-size: 14px;
  }
  .btn.primario { background: var(--amarelo); color: var(--noite); }
  .btn.secundario { background: var(--profundo); color: var(--areia); }
  .ck-salvo { font-size: 12px; color: var(--suave); margin-top: 10px; min-height: 16px; }
  .ck-salvo.erro { color: #b3261e; font-weight: 700; }
  .ck-salvo button { border: 0; background: none; color: inherit; text-decoration: underline; font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    background: var(--noite); color: var(--areia); padding: 10px 16px; border-radius: 10px;
    font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.mostra { opacity: 1; }

  /* ---------- rodapé, estados ---------- */
  .rodape {
    max-width: 640px; margin: 0 auto; padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--linha); font-size: 14px; color: var(--suave);
  }
  .rodape p + p { margin-top: 6px; }
  .rodape a { color: var(--profundo); font-weight: 700; text-decoration: none; }
  .tagline { margin-top: 18px; font-size: 11px; letter-spacing: 0.18em; color: var(--laranja); text-transform: uppercase; }
  .estado { text-align: center; padding: 48px 16px; color: var(--suave); }
  .estado h2 { font-family: 'Outfit', sans-serif; color: var(--profundo); font-size: 20px; margin-bottom: 8px; }
  .aviso-amostra {
    background: var(--amarelo); color: var(--noite); font-size: 13px; font-weight: 600;
    padding: 8px 16px; text-align: center;
  }
  .pin { max-width: 320px; margin: 48px auto; text-align: center; padding: 0 16px; }
  .pin h2 { font-family: 'Outfit', sans-serif; color: var(--profundo); margin-bottom: 8px; }
  .pin input {
    width: 100%; font-size: 28px; text-align: center; letter-spacing: 0.3em;
    padding: 12px; border: 2px solid var(--profundo); background: var(--branco); margin: 16px 0 12px;
    font-family: 'Outfit', sans-serif;
  }
  .pin button {
    width: 100%; background: var(--profundo); color: var(--areia); border: 0; border-radius: 999px;
    padding: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 13px;
  }
  .pin .erro { color: var(--laranja); font-weight: 700; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>

<header class="topo">
  <svg class="marca-dagua" viewBox="0 0 412.18 320.88" aria-hidden="true"><use href="#simbolo-nomades"/></svg>
  <div class="topo-linha">
    <div class="logo">
      <svg viewBox="0 0 412.18 320.88" aria-hidden="true"><use href="#simbolo-nomades"/></svg>
      <div class="logo-texto">
        <span class="logo-nome">Nômades</span>
        <span class="logo-sub">Limpezas da semana</span>
      </div>
    </div>
    <button class="btn-atualizar" id="btnAtualizar" type="button" aria-label="Atualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Atualizar
    </button>
  </div>
  <div class="atualizado" id="atualizado">Carregando…</div>
  <nav class="dias" id="dias" aria-label="Dias"></nav>
</header>

<div id="avisoAmostra"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</footer>

var INSUMOS = ['Papel higiênico', 'Sabonete', 'Detergente', 'Esponja', 'Sacos de lixo',
  'Água sanitária', 'Desinfetante / multiuso', 'Álcool', 'Pilhas (controles)'];
var INSUMO_ROTULO = { ok: 'OK', baixo: 'Acabando', acabou: 'Acabou' };

// Até quantos dias depois da saída a próxima entrada define os kits.
// Além disso, monta todas as camas fixas (quem aparecer de última hora entra).
var JANELA_KITS = 7;

/* =====================================================================
   REGRAS — espelham a skill gerar-cronograma-de-limpezas
   ===================================================================== */

function normalizar(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function acharImovel(nome) {
  if (IMOVEIS[nome]) return IMOVEIS[nome];
  var n = normalizar(nome);
  for (var k in IMOVEIS) if (normalizar(k) === n) return IMOVEIS[k];
  // Imóvel novo, ainda não configurado aqui: aparece com o nome da planilha.
  return { apelido: nome, chave: [], endereco: '', bairro: '', camas: [1, 0, 0], kit: 'fixas', notas: [] };
}

function acharAnuncio(imovel, anuncios) {
  if (!imovel.chave.length) return null;
  for (var i = 0; i < anuncios.length; i++) {
    var end = normalizar(anuncios[i].endereco);
    var ok = imovel.chave.every(function (c) { return end.indexOf(c) !== -1; });
    if (ok) return anuncios[i];
  }
  return null;
}

function diasEntre(a, b) {
  return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000);
}

function minutos(hhmm) {
  if (!hhmm) return null;
  var p = hhmm.split(':');
  return Number(p[0]) * 60 + Number(p[1] || 0);
}

function horaCurta(hhmm) {
  var p = hhmm.split(':');
  var h = String(Number(p[0]));
  return p[1] && p[1] !== '00' ? h + 'h' + p[1] : h + 'h';
}

function kit(n, tipo) {
  var nome = tipo === 'casal'
    ? (n === 1 ? 'Kit Casal' : 'Kits Casal')
    : (n === 1 ? 'Kit Solteiro' : 'Kits Solteiros');
  return { qt: n, nome: nome };
}

/** Kits a montar e a guardar, segundo a regra de ouro:
 *  cama fixa se monta; cama auxiliar e sofá-cama não — o kit fica no armário.
 *  Sofá-cama usa Kit CASAL; cama de solteiro (fixa ou auxiliar) usa Kit Solteiro. */
function calcularKits(imovel, camas, proxima) {
  var casal = camas[0], solteiro = camas[1], sofa = camas[2];
  var montar = [], guardar = [];
  var usaProxima = !!proxima;

  // Kit Casal montado nunca passa das camas de casal fixas; o do sofá-cama é à parte.
  var nCasal = usaProxima && proxima.kitCasal != null ? Math.min(proxima.kitCasal, casal) : casal;
  if (nCasal > 0) montar.push(kit(nCasal, 'casal'));

  var pedidoSolteiro = usaProxima && proxima.kitSolteiro != null ? proxima.kitSolteiro : null;

  if (imovel.kit === 'sofaArmario') {
    guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
  } else if (imovel.kit === 'pedro') {
    // Pedro Américo: 1 casal + sofá-cama. Monta o sofá quando a cama de casal não comporta todos.
    if (usaProxima && proxima.hospedes > 2) {
      montar.push(Object.assign(kit(1, 'casal'), { det: 'No sofá-cama — os próximos hóspedes vão usar' }));
    } else {
      guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
    }
  } else if (imovel.kit === 'bicama') {
    // Porto Carioca 2303: as duas de solteiro são bicama (uma dentro da outra).
    var nb = pedidoSolteiro == null ? 1 : Math.min(pedidoSolteiro, 2);
    if (nb > 0) montar.push(Object.assign(kit(nb, 'solteiro'), {
      det: nb === 1 ? 'Só a cama de cima da bicama' : 'As duas camas da bicama'
    }));
    if (nb < 2) guardar.push(Object.assign(kit(1, 'solteiro'), { det: 'Para o caso de virem 4 hóspedes' }));
  } else {
    var ns = pedidoSolteiro == null ? solteiro : Math.min(pedidoSolteiro, solteiro);
    if (ns > 0) montar.push(kit(ns, 'solteiro'));
    if (sofa > 0) guardar.push(Object.assign(kit(1, 'casal'), { det: 'Do sofá-cama — não montar o sofá-cama' }));
  }
  return { montar: montar, guardar: guardar, hospedes: usaProxima ? proxima.hospedes : null };
}

function montarCronograma(dados) {
  var hoje = dados.hoje;
  var dias = [];
  for (var i = 0; i <= 7; i++) dias.push({ data: somar(hoje, i), limpezas: [] });

  dados.checkouts.forEach(function (co) {
    var imovel = acharImovel(co.anuncio);
    var anuncio = acharAnuncio(imovel, dados.anuncios || []);

    var camas = imovel.camas.slice();
    if (anuncio && anuncio.camasCasal != null) {
      camas = [anuncio.camasCasal, anuncio.camasSolteiro || 0, anuncio.sofas || 0];
    }

    // Próxima entrada no mesmo imóvel a partir do dia da saída.
    var proxima = dados.checkins
      .filter(function (ci) { return normalizar(ci.anuncio) === normalizar(co.anuncio) && ci.data >= co.data; })
      .sort(function (a, b) { return (a.data + a.horario).localeCompare(b.data + b.horario); })[0] || null;
    var proximaNaJanela = proxima && diasEntre(co.data, proxima.data) <= JANELA_KITS ? proxima : null;
    var entradaMesmoDia = proxima && proxima.data === co.data ? proxima : null;

    // Horário: início ou prazo.
    var saida = co.horario || '11:00';
    var hora, prazo = false, ressalva = '';
    if (co.combinado) {
      hora = co.combinado;
    } else if (minutos(saida) < minutos('11:00')) {
      hora = 'a partir das ' + horaCurta(saida);
      ressalva = 'Hóspede sai cedo — confirmar na manhã do dia';
    } else if (entradaMesmoDia || minutos(saida) > minutos('11:00')) {
      hora = 'a partir das ' + horaCurta(saida);
    } else {
      hora = 'até as 15h';
      prazo = true;
    }

    var avisos = [];
    if (co.recado) avisos.push({ texto: co.recado, tipo: 'recado' });
    imovel.notas.forEach(function (n) { avisos.push({ texto: n }); });
    if (anuncio && anuncio.observacoes) {
      var jaTem = imovel.notas.some(function (n) { return normalizar(n).indexOf(normalizar(anuncio.observacoes)) !== -1; });
      if (!jaTem) avisos.push({ texto: anuncio.observacoes });
    }

    var dia = dias.filter(function (d) { return d.data === co.data; })[0];
    if (!dia) return;
    dia.limpezas.push({
      nomePlanilha: co.anuncio,
      data: co.data,
      imovel: imovel,
      anuncio: anuncio,
      hora: hora,
      prazo: prazo,
      ressalva: ressalva,
      prioridade: entradaMesmoDia ? 'Entrada às ' + horaCurta(entradaMesmoDia.horario || '15:00') : '',
      entradaMin: entradaMesmoDia ? minutos(entradaMesmoDia.horario || '15:00') : 9999,
      feito: co.limpezaRealizada === 'OK',
      kits: calcularKits(imovel, camas, proximaNaJanela),
      avisos: avisos
    });
  });

  // Mesma rua no mesmo dia = uma viagem só.
  dias.forEach(function (d) {
    d.limpezas.sort(function (a, b) { return a.entradaMin - b.entradaMin; });
    var mesmaRua = d.limpezas.filter(function (l) { return l.imovel.rua === 'milton-santos'; });
    if (mesmaRua.length > 1) {
      mesmaRua.forEach(function (l) {
        var outros = mesmaRua.filter(function (o) { return o !== l; }).map(function (o) { return o.imovel.apelido; });
        l.avisos.push({ texto: 'Mesma rua de ' + juntar(outros) + ' — dá pra fazer na mesma ida.', tipo: 'dica' });
      });
    }
  });
  return dias;
}

function juntar(lista) {
  if (lista.length < 2) return lista.join('');
  return lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
}

function somar(iso, n) {
  var p = iso.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}

/* =====================================================================
   TELA
   ===================================================================== */

var SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
var SEMANA_CURTA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

function diaSemana(iso) { return new Date(iso + 'T12:00:00Z').getUTCDay(); }
function ddmm(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function telefoneLink(txt) {
  // "Portaria: (21) 3597-9383" → link tel: mantendo o texto.
  return esc(txt).replace(/\(?\d{2}\)?\s?\d{4,5}-?\d{4}/g, function (num) {
    var d = num.replace(/\D/g, '');
    return '<a href="tel:+55' + d + '">' + num + '</a>';
  });
}

function mapaLink(end) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(end + ', Rio de Janeiro - RJ');
}

function renderizar(dados) {
  var dias = montarCronograma(dados);
  var hoje = dados.hoje;

  var g = dados.geradoEm || '';
  document.getElementById('atualizado').textContent =
    'Atualizado em ' + ddmm(g.slice(0, 10)) + ' às ' + g.slice(11, 16) + ' · puxa direto da planilha';

  document.getElementById('dias').innerHTML = dias.map(function (d, i) {
    var n = d.limpezas.filter(function (l) { return !l.feito; }).length;
    var rot = i === 0 ? 'hoje' : SEMANA_CURTA[diaSemana(d.data)];
    return '<button type="button" class="dia-chip' + (n ? ' tem' : '') + (i === 0 ? ' ativo' : '') +
      '" data-alvo="dia-' + d.data + '"><span class="sem">' + rot + '</span><span class="num">' +
      d.data.slice(8, 10) + '</span><span class="qtd">' + n + '</span></button>';
  }).join('');

  document.getElementById('conteudo').innerHTML = dias.map(function (d, i) {
    var rotulo = i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : cap(SEMANA[diaSemana(d.data)]);
    var sub = (i <= 1 ? SEMANA[diaSemana(d.data)] + ', ' : '') + ddmm(d.data);
    var n = d.limpezas.length;
    var corpo = n ? d.limpezas.map(cartao).join('') : '<div class="vazio">Nenhuma limpeza neste dia.</div>';
    return '<section class="dia" id="dia-' + d.data + '"><div class="dia-titulo"><h2>' + rotulo +
      ' <small>· ' + sub + '</small></h2><span class="conta">' + (n ? n + (n === 1 ? ' limpeza' : ' limpezas') : '') +
      '</span></div>' + corpo + '</section>';
  }).join('');

  ligarChips();
  reabrirChecklists();
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function cartao(l) {
  var im = l.imovel, an = l.anuncio;
  var endereco = im.endereco || (an && an.endereco) || '';
  var bairro = (an && an.bairro) || im.bairro;
  var classes = 'card' + (l.feito ? ' feito' : l.prioridade ? ' critico' : '');

  var tags = '<span class="tag tag-hora' + (l.prazo ? ' prazo' : '') + '">' + esc(l.hora) + '</span>';
  if (l.feito) tags += '<span class="tag tag-feito">✓ Feita</span>';
  else if (l.prioridade) tags += '<span class="tag tag-prioridade">⚠️ ' + esc(l.prioridade) + '</span>';
  if (l.ressalva) tags += '<span class="ressalva">' + esc(l.ressalva) + '</span>';

  var h = '<article class="' + classes + '"><div class="card-topo"><div class="horario-linha">' + tags + '</div>' +
    '<div class="imovel">' + esc(im.apelido) + '</div>' +
    '<div class="endereco">' + esc(endereco) + (bairro ? ' · ' + esc(bairro) : '') +
    (endereco ? ' &nbsp;<a href="' + mapaLink(endereco) + '" target="_blank" rel="noopener">Mapa</a>' : '') +
    '</div></div>';

  // Enxoval
  var k = l.kits;
  var itens = k.montar.map(function (x) {
    return '<li><span class="qt">' + x.qt + '</span><span><b>' + esc(x.nome) + '</b> — montar' +
      (x.det ? '<span class="det">' + esc(x.det) + '</span>' : '') + '</span></li>';
  }).concat(k.guardar.map(function (x) {
    return '<li class="armario"><span class="qt">' + x.qt + '</span><span><b>' + esc(x.nome) + '</b> — guardado no armário' +
      (x.det ? '<span class="det">' + esc(x.det) + '</span>' : '') + '</span></li>';
  }));
  h += '<div class="bloco"><div class="bloco-rotulo">🧺 Enxoval a deixar</div><ul class="kits">' + itens.join('') + '</ul>' +
    (k.hospedes ? '<div class="hospedes">Próxima reserva: ' + k.hospedes + (k.hospedes === 1 ? ' hóspede' : ' hóspedes') + '</div>' : '') +
    '</div>';

  // Acesso
  if (an) {
    var linhas = [];
    if (an.tipoAcesso) linhas.push('<div>🔑 ' + esc(an.tipoAcesso) + (an.condominio && an.condominio !== 'N/A' ? ' · ' + esc(an.condominio) : '') + '</div>');
    if (an.portaria && an.portaria !== 'N/A') linhas.push('<div>☎️ ' + telefoneLink(an.portaria) + '</div>');
    if (linhas.length) h += '<div class="bloco"><div class="bloco-rotulo">Acesso</div><div class="acesso">' + linhas.join('') + '</div></div>';
  }

  // Atenção
  if (l.avisos.length) {
    h += '<div class="bloco"><div class="bloco-rotulo">Atenção</div><ul class="avisos">' +
      l.avisos.map(function (a) { return '<li' + (a.tipo ? ' class="' + a.tipo + '"' : '') + '>' + esc(a.texto) + '</li>'; }).join('') +
      '</ul></div>';
  }

  // Checklist (salvo no Drive, compartilhado entre os celulares)
  var id = l.data + '|' + l.nomePlanilha;
  CK_INFO[id] = { apelido: im.apelido, data: l.data };
  h += '<details class="ck" data-ck="' + esc(id) + '"><summary><span class="ck-titulo">📋 Checklist da limpeza</span>' +
    '<span class="ck-resumo" data-resumo>' + resumoCk(id) + '</span></summary>' +
    '<div class="ck-corpo"><div class="ck-carregando">Carregando…</div></div></details>';
  return h + '</article>';
}

/* ---------- interações ---------- */

function ligarChips() {
  var chips = document.querySelectorAll('.dia-chip');
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      chips.forEach(function (x) { x.classList.remove('ativo'); });
      c.classList.add('ativo');
      var alvo = document.getElementById(c.getAttribute('data-alvo'));
      if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function guardar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) {} }
function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }
function apagar(chave) { try { localStorage.removeItem(chave); } catch (e) {} }

/* ---------- checklist da limpeza ----------
   Estado no servidor (Drive): checks, sup (insumos), problemas, fotos.
   Enquanto o checklist está aberto, marcações locais mandam; do servidor
   só voltam as fotos (que ganham id e nome lá). */

var CK = {};         // id → estado carregado
var CK_INFO = {};    // id → { apelido, data }
var CK_ABERTOS = {}; // checklists abertos, para reabrir depois de Atualizar
var CK_PEND = {};    // id → { campo: valor } ainda não confirmados pelo servidor
var CK_ENVIO = {};   // id → fotos na fila de envio
var CK_ENVIANDO = {};
var CK_SEQ = 0;
var FOTO_ROTULO = { antes: 'de antes', depois: 'de depois', problema: 'do problema' };

function pinAtual() { return ler('nomades-pin') || ''; }

function chamar(fn, args, ok, falha) {
  var okPin = function (r) {
    if (r && r.erro === 'PIN') falha(new Error('O PIN mudou. Toque em Atualizar e digite de novo.'));
    else if (r && r.erro) falha(new Error(r.mensagem || r.erro));
    else ok(r);
  };
  var falhaMsg = function (e) { falha(e instanceof Error ? e : new Error(e && e.message || String(e))); };
  if (!PREVIA_LOCAL) {
    // Mesmo formato do cronograma: POST em texto puro (sem checagem extra de CORS).
    // O Apps Script recebe { acao, args } e devolve JSON.
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status); return r.json(); })
      .then(okPin)
      .catch(function (e) {
        falhaMsg(e && /fetch|network|load failed/i.test(e.message) ? new Error('Sem internet ou servidor fora do ar') : e);
      });
    return;
  }
  setTimeout(function () {
    try { okPin(AMOSTRA_API[fn].apply(null, args)); } catch (e) { falhaMsg(e); }
  }, 250);
}

function detsDe(id) {
  return Array.prototype.filter.call(document.querySelectorAll('details.ck'), function (d) {
    return d.getAttribute('data-ck') === id;
  });
}

function contarCk(id) {
  var est = CK[id], total = 0, feitos = 0;
  CK_SECOES.forEach(function (sec) {
    if (sec.insumos) {
      total += INSUMOS.length;
      feitos += INSUMOS.filter(function (_, i) { return est.sup[i]; }).length;
    } else {
      total += sec.itens.length;
      feitos += sec.itens.filter(function (_, i) { return est.checks[sec.id + '-' + i]; }).length;
    }
  });
  return { total: total, feitos: feitos, pct: Math.round(feitos / total * 100) };
}

function fotosDe(id, secao) {
  return (CK[id] ? CK[id].fotos : []).filter(function (f) { return f.secao === secao; });
}

function resumoCk(id) {
  if (!CK[id]) return 'abrir';
  var c = contarCk(id), n = CK[id].fotos.length;
  return c.pct + '%' + (n ? ' · 📷 ' + n : '');
}

function secaoCompleta(id, sec) {
  var est = CK[id];
  if (sec.insumos) return INSUMOS.every(function (_, i) { return est.sup[i]; });
  var ok = sec.itens.every(function (_, i) { return est.checks[sec.id + '-' + i]; });
  return ok && (!sec.fotos || fotosDe(id, sec.fotos.secao).length > 0);
}

function corpoCk(id) {
  var est = CK[id], c = contarCk(id);
  var h = '<div class="ck-barra"><i data-barra style="width:' + c.pct + '%"></i></div>';
  CK_SECOES.forEach(function (sec, n) {
    h += '<section class="ck-sec' + (sec.escuro ? ' escuro' : '') + (secaoCompleta(id, sec) ? ' completa' : '') +
      '" data-sec="' + sec.id + '"><h3><span class="n" aria-hidden="true">' + (n + 1) + '</span>' + esc(sec.titulo) + '</h3>';
    if (sec.escuro) h += '<p class="obrig"><b aria-hidden="true"></b>Obrigatório</p>';
    if (sec.sub) h += '<p class="ck-sub">' + esc(sec.sub) + '</p>';
    if (sec.insumos) {
      h += '<p class="dica-ins">Marque <b>Acabando</b> se só dá para mais 1 ou 2 estadias. Assim dá tempo de comprar.</p>';
      INSUMOS.forEach(function (nome, i) {
        var v = est.sup[i] || '';
        h += '<div class="ins"><span>' + esc(nome) + '</span><div class="seg" role="group" aria-label="' + esc(nome) + '">' +
          ['ok', 'baixo', 'acabou'].map(function (o) {
            return '<button type="button" data-sup="' + i + '" data-v="' + o + '" aria-pressed="' + (v === o) + '">' + INSUMO_ROTULO[o] + '</button>';
          }).join('') + '</div></div>';
      });
      var tid = 'prob-' + (++CK_SEQ);
      h += '<label class="rot" for="' + tid + '">Problemas, danos ou manutenção</label>' +
        '<textarea id="' + tid + '" rows="3" data-prob placeholder="Ex.: lâmpada do banheiro queimada, mancha no sofá">' + esc(est.problemas) + '</textarea>' +
        '<div class="fotos" data-fotos="problema">' + gradeFotos(id, 'problema', 'Fotos do problema', 'Se tiver dano, quebra ou mancha.') + '</div>';
    } else {
      h += '<ul class="ck-itens">' + sec.itens.map(function (it, i) {
        var k = sec.id + '-' + i;
        return '<li><label><input type="checkbox" data-item="' + k + '"' + (est.checks[k] ? ' checked' : '') + '><span>' +
          esc(it[0]) + (it[1] ? '<em>' + esc(it[1]) + '</em>' : '') + '</span></label></li>';
      }).join('') + '</ul>';
      if (sec.fotos) h += '<div class="fotos" data-fotos="' + sec.fotos.secao + '">' + gradeFotos(id, sec.fotos.secao, sec.fotos.rotulo, sec.fotos.dica) + '</div>';
    }
    h += '</section>';
  });
  var m = mensagemCk(id);
  h += '<div class="ck-fim"><h3>Mandar no grupo</h3>' +
    '<p class="falta" data-falta' + (m.falta.length ? '' : ' hidden') + '>' + esc(m.falta.length ? 'Falta: ' + m.falta.join(', ') + '.' : '') + '</p>' +
    '<pre class="msg" data-msg>' + esc(m.texto) + '</pre>' +
    '<div class="acoes"><button type="button" class="btn primario" data-copiar>Copiar mensagem</button>' +
    '<a class="btn secundario" data-wa target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(m.texto) + '">Abrir no WhatsApp</a></div>' +
    '<p class="ck-salvo" data-salvo>Salvo na pasta do cliente · guardado por 90 dias</p></div>';
  return h;
}

function gradeFotos(id, secao, rotulo, dica) {
  var h = '<div class="fotos-rotulo">📷 ' + esc(rotulo) + '</div>' + (dica ? '<div class="fotos-dica">' + esc(dica) + '</div>' : '') +
    '<div class="fotos-grade">';
  fotosDe(id, secao).forEach(function (f, i) {
    h += '<div class="foto">' + (f.mini ? '<img src="' + esc(f.mini) + '" alt="Foto ' + FOTO_ROTULO[secao] + ' ' + (i + 1) + '">' : '<span class="st">📷</span>') +
      '<button type="button" class="x" data-apagar="' + esc(f.id) + '" aria-label="Apagar foto">×</button></div>';
  });
  (CK_ENVIO[id] || []).filter(function (e) { return e.secao === secao; }).forEach(function (e) {
    h += '<div class="foto">' + (e.mini ? '<img src="' + e.mini + '" alt="">' : '') +
      (e.status === 'erro'
        ? '<button type="button" class="st erro" data-reenviar="' + e.tmp + '">Não foi · tocar p/ tentar</button>'
        : '<span class="st">' + (e.status === 'preparando' ? 'Preparando…' : 'Enviando…') + '</span>') + '</div>';
  });
  return h + '<label class="btn-foto"><input type="file" accept="image/*" multiple data-add="' + secao + '" data-ckid="' + esc(id) + '" onchange="receberFotos(this)"><span aria-hidden="true">📷</span>Adicionar</label></div>';
}

function mensagemCk(id) {
  var est = CK[id], info = CK_INFO[id] || {};
  var nA = fotosDe(id, 'antes').length, nD = fotosDe(id, 'depois').length, nP = fotosDe(id, 'problema').length;
  var vidA = est.checks['antes-2'], vidD = est.checks['depois-1'];
  var acabou = [], baixo = [], semMarcar = 0;
  INSUMOS.forEach(function (nome, i) {
    var v = est.sup[i];
    if (v === 'acabou') acabou.push(nome); else if (v === 'baixo') baixo.push(nome); else if (!v) semMarcar++;
  });
  var t = '✅ Limpeza concluída\n🏠 ' + (info.apelido || '') + '\n📅 ' + (info.data ? ddmm(info.data) : '') + '\n\n' +
    '🎥 Vídeo de antes: ' + (vidA ? 'enviado' : 'NÃO enviado') + '\n' +
    '🎥 Vídeo de depois: ' + (vidD ? 'enviado' : 'NÃO enviado') + '\n' +
    '📷 Fotos no app: ' + nA + ' de antes · ' + nD + ' de depois\n\n';
  if (acabou.length || baixo.length) {
    t += '🛒 Comprar:\n' + acabou.map(function (x) { return '• ' + x + ' (acabou)\n'; }).join('') +
      baixo.map(function (x) { return '• ' + x + ' (acabando)\n'; }).join('');
  } else t += '🛒 Insumos: tudo OK\n';
  t += '\n⚠️ Problemas: ' + (String(est.problemas || '').trim() || 'nenhum') +
    (nP ? ' (' + nP + (nP === 1 ? ' foto' : ' fotos') + ' no app)' : '');

  var c = contarCk(id), itensFalta = 0;
  CK_SECOES.forEach(function (sec) {
    if (sec.itens) itensFalta += sec.itens.filter(function (_, i) { return !est.checks[sec.id + '-' + i]; }).length;
  });
  var falta = [];
  if (!vidA) falta.push('vídeo de antes');
  if (!nA) falta.push('fotos de antes');
  if (!vidD) falta.push('vídeo de depois');
  if (!nD) falta.push('fotos de depois');
  if (semMarcar) falta.push(semMarcar + (semMarcar === 1 ? ' insumo sem marcar' : ' insumos sem marcar'));
  if (itensFalta) falta.push(itensFalta + (itensFalta === 1 ? ' item do checklist' : ' itens do checklist'));
  return { texto: t, falta: falta, pct: c.pct };
}

function renderCk(id) {
  detsDe(id).forEach(function (d) {
    d.querySelector('.ck-corpo').innerHTML = corpoCk(id);
    d.querySelector('[data-resumo]').textContent = resumoCk(id);
  });
}

// Atualiza números, seções completas e mensagem sem redesenhar (não tira o foco do campo).
function atualizarCk(id) {
  var m = mensagemCk(id);
  detsDe(id).forEach(function (d) {
    d.querySelector('[data-resumo]').textContent = resumoCk(id);
    var barra = d.querySelector('[data-barra]');
    if (!barra) return;
    barra.style.width = m.pct + '%';
    CK_SECOES.forEach(function (sec) {
      var el = d.querySelector('[data-sec="' + sec.id + '"]');
      if (el) el.classList.toggle('completa', secaoCompleta(id, sec));
    });
    var f = d.querySelector('[data-falta]');
    f.hidden = !m.falta.length;
    f.textContent = m.falta.length ? 'Falta: ' + m.falta.join(', ') + '.' : '';
    d.querySelector('[data-msg]').textContent = m.texto;
    d.querySelector('[data-wa]').href = 'https://wa.me/?text=' + encodeURIComponent(m.texto);
  });
}

function atualizarFotos(id) {
  detsDe(id).forEach(function (d) {
    Array.prototype.forEach.call(d.querySelectorAll('[data-fotos]'), function (box) {
      var secao = box.getAttribute('data-fotos');
      var sec = CK_SECOES.filter(function (s) { return s.fotos && s.fotos.secao === secao; })[0];
      box.innerHTML = sec ? gradeFotos(id, secao, sec.fotos.rotulo, sec.fotos.dica)
        : gradeFotos(id, secao, 'Fotos do problema', 'Se tiver dano, quebra ou mancha.');
    });
  });
  atualizarCk(id);
}

function statusSalvo(id, texto, erro) {
  detsDe(id).forEach(function (d) {
    var el = d.querySelector('[data-salvo]');
    if (!el) return;
    el.classList.toggle('erro', Boolean(erro));
    el.innerHTML = esc(texto) + (erro ? ' <button type="button" data-retentar>Tentar de novo</button>' : '');
  });
}

function carregarCk(id) {
  chamar('getChecklist', [pinAtual(), id], function (est) {
    var pend = CK_PEND[id] || {};
    Object.keys(pend).forEach(function (campo) { aplicarCampo(est, campo, pend[campo]); });
    CK[id] = est;
    renderCk(id);
  }, function (e) {
    if (CK[id]) { statusSalvo(id, 'Sem conexão — mostrando o que já estava neste celular.', true); return; }
    detsDe(id).forEach(function (d) {
      d.querySelector('.ck-corpo').innerHTML = '<div class="ck-carregando">Não deu pra abrir: ' + esc(e.message) +
        ' <button type="button" class="btn-link" data-recarregar>Tentar de novo</button></div>';
    });
  });
}

function aplicarCampo(est, campo, valor) {
  var m;
  if ((m = campo.match(/^check:(.+)$/))) { if (valor) est.checks[m[1]] = true; else delete est.checks[m[1]]; }
  else if ((m = campo.match(/^sup:(\d+)$/))) { if (valor) est.sup[m[1]] = valor; else delete est.sup[m[1]]; }
  else if (campo === 'problemas') est.problemas = valor;
}

function salvarCampo(id, campo, valor) {
  CK_PEND[id] = CK_PEND[id] || {};
  CK_PEND[id][campo] = valor;
  statusSalvo(id, 'Salvando…');
  chamar('salvarMarcacao', [pinAtual(), id, campo, valor], function () {
    if (CK_PEND[id] && CK_PEND[id][campo] === valor) delete CK_PEND[id][campo];
    if (!Object.keys(CK_PEND[id] || {}).length) statusSalvo(id, 'Salvo ✓');
  }, function (e) {
    statusSalvo(id, 'Não salvou: ' + e.message, true);
  });
}

function reenviarPendentes(id) {
  var pend = CK_PEND[id] || {};
  Object.keys(pend).forEach(function (campo) { salvarCampo(id, campo, pend[campo]); });
}

/* ---------- fotos: comprimidas no celular (~300 KB) antes de subir ---------- */

function comprimir(arquivo, lado, qualidade) {
  return new Promise(function (ok, falha) {
    var url = URL.createObjectURL(arquivo);
    var img = new Image();
    img.onload = function () {
      var escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * escala);
      cv.height = Math.round(img.naturalHeight * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = function () { URL.revokeObjectURL(url); falha(new Error('Não consegui ler essa foto')); };
    img.src = url;
  });
}

function enfileirarFoto(id, secao, arquivo) {
  var item = { tmp: 't' + (++CK_SEQ), secao: secao, status: 'preparando', mini: '', dados: '' };
  (CK_ENVIO[id] = CK_ENVIO[id] || []).push(item);
  atualizarFotos(id);
  comprimir(arquivo, 1600, 0.7).then(function (grande) {
    item.dados = grande.split(',')[1];
    return comprimir(arquivo, 200, 0.6);
  }).then(function (mini) {
    item.mini = mini;
    item.status = 'fila';
    atualizarFotos(id);
    processarFila(id);
  }).catch(function (e) {
    CK_ENVIO[id] = CK_ENVIO[id].filter(function (x) { return x !== item; });
    atualizarFotos(id);
    toast(e.message);
  });
}

function processarFila(id) {
  if (CK_ENVIANDO[id]) return;
  var item = (CK_ENVIO[id] || []).filter(function (x) { return x.status === 'fila'; })[0];
  if (!item) return;
  CK_ENVIANDO[id] = true;
  item.status = 'enviando';
  chamar('enviarFoto', [pinAtual(), id, item.secao, item.dados, item.mini], function (est) {
    CK_ENVIANDO[id] = false;
    CK_ENVIO[id] = CK_ENVIO[id].filter(function (x) { return x !== item; });
    CK[id].fotos = est.fotos;
    atualizarFotos(id);
    processarFila(id);
  }, function (e) {
    CK_ENVIANDO[id] = false;
    item.status = 'erro';
    atualizarFotos(id);
    toast('Foto não foi: ' + e.message);
    processarFila(id);
  });
}

function apagarFotoCk(id, fotoId) {
  if (!confirm('Apagar esta foto?')) return;
  var antes = CK[id].fotos;
  CK[id].fotos = antes.filter(function (f) { return f.id !== fotoId; });
  atualizarFotos(id);
  chamar('apagarFoto', [pinAtual(), id, fotoId], function (est) {
    CK[id].fotos = est.fotos;
    atualizarFotos(id);
  }, function (e) {
    CK[id].fotos = antes;
    atualizarFotos(id);
    toast('Não deu pra apagar: ' + e.message);
  });
}

function toast(t) {
  var el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('mostra');
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { el.classList.remove('mostra'); }, 2200);
}

function copiar(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast('Mensagem copiada'); }, function () { copiarVelho(txt); });
  } else copiarVelho(txt);
}
function copiarVelho(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Mensagem copiada'); } catch (e) { toast('Selecione o texto e copie'); }
  ta.remove();
}

// Depois de Atualizar, reabre o que estava aberto.
function reabrirChecklists() {
  Array.prototype.forEach.call(document.querySelectorAll('details.ck'), function (d) {
    if (CK_ABERTOS[d.getAttribute('data-ck')]) d.open = true;
  });
}

function idDoAlvo(el) {
  var d = el.closest && el.closest('details.ck');
  return d ? d.getAttribute('data-ck') : null;
}

// "toggle" não borbulha: escuta na captura.
document.addEventListener('toggle', function (e) {
  var d = e.target;
  if (!d.classList || !d.classList.contains('ck')) return;
  var id = d.getAttribute('data-ck');
  if (!d.open) { delete CK_ABERTOS[id]; return; }
  CK_ABERTOS[id] = true;
  if (CK[id]) renderCk(id);
  carregarCk(id);
}, true);

document.addEventListener('change', function (e) {
  var t = e.target, id = idDoAlvo(t);
  if (!id || !CK[id]) return;
  if (t.hasAttribute('data-item')) {
    var k = t.getAttribute('data-item');
    if (t.checked) CK[id].checks[k] = true; else delete CK[id].checks[k];
    salvarCampo(id, 'check:' + k, t.checked);
    atualizarCk(id);
  }
});

// Fotos: o handler fica no próprio campo (onchange) porque a grade de fotos é
// redesenhada enquanto outra foto sobe. Se o campo sair da tela com a galeria
// aberta, o evento não chegaria ao document e a foto escolhida se perderia.
function receberFotos(t) {
  var id = t.getAttribute('data-ckid'), secao = t.getAttribute('data-add');
  if (!id || !CK[id]) return;
  Array.prototype.forEach.call(t.files || [], function (f) { enfileirarFoto(id, secao, f); });
  t.value = '';
}

var PROB_TIMER = {};
document.addEventListener('input', function (e) {
  var t = e.target, id = idDoAlvo(t);
  if (!id || !CK[id] || !t.hasAttribute('data-prob')) return;
  CK[id].problemas = t.value;
  atualizarCk(id);
  clearTimeout(PROB_TIMER[id]);
  PROB_TIMER[id] = setTimeout(function () { salvarCampo(id, 'problemas', t.value); }, 800);
});

document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button');
  if (!b) return;
  var id = idDoAlvo(b);
  if (!id) return;
  if (b.hasAttribute('data-recarregar')) { carregarCk(id); return; }
  if (!CK[id]) return;
  if (b.hasAttribute('data-sup')) {
    var i = b.getAttribute('data-sup'), v = b.getAttribute('data-v');
    var novo = CK[id].sup[i] === v ? '' : v;
    if (novo) CK[id].sup[i] = novo; else delete CK[id].sup[i];
    Array.prototype.forEach.call(b.parentNode.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(novo === x.getAttribute('data-v')));
    });
    salvarCampo(id, 'sup:' + i, novo);
    atualizarCk(id);
  } else if (b.hasAttribute('data-apagar')) {
    apagarFotoCk(id, b.getAttribute('data-apagar'));
  } else if (b.hasAttribute('data-reenviar')) {
    var tmp = b.getAttribute('data-reenviar');
    (CK_ENVIO[id] || []).forEach(function (x) { if (x.tmp === tmp) x.status = 'fila'; });
    atualizarFotos(id);
    processarFila(id);
  } else if (b.hasAttribute('data-retentar')) {
    reenviarPendentes(id);
  } else if (b.hasAttribute('data-copiar')) {
    copiar(mensagemCk(id).texto);
  }
});

/* Prévia no computador: mesmo contrato do Code.gs, guardado neste navegador. */
var AMOSTRA_API = {
  _ler: function (id) {
    try { return JSON.parse(localStorage.getItem('nomades-ck-amostra|' + id)); } catch (e) { return null; }
  },
  _gravar: function (id, est) { guardar('nomades-ck-amostra|' + id, JSON.stringify(est)); return est; },
  getChecklist: function (pin, id) {
    return AMOSTRA_API._ler(id) || { checks: {}, sup: {}, problemas: '', fotos: [] };
  },
  salvarMarcacao: function (pin, id, campo, valor) {
    var est = AMOSTRA_API.getChecklist(pin, id);
    aplicarCampo(est, campo, valor);
    return AMOSTRA_API._gravar(id, est);
  },
  enviarFoto: function (pin, id, secao, base64, mini) {
    var est = AMOSTRA_API.getChecklist(pin, id);
    est.fotos.push({ id: 'f' + Date.now() + Math.random().toString(36).slice(2, 6), secao: secao, mini: mini, kb: Math.round(base64.length * 0.75 / 1024) });
    return AMOSTRA_API._gravar(id, est);
  },
  apagarFoto: function (pin, id, fotoId) {
    var est = AMOSTRA_API.getChecklist(pin, id);
    est.fotos = est.fotos.filter(function (f) { return f.id !== fotoId; });
    return AMOSTRA_API._gravar(id, est);
  }
};

/* ---------- carregar ---------- */

var PREVIA_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:';
var DADOS_HOJE = '';

function mostrarErro(msg) {
  document.getElementById('conteudo').innerHTML =
    '<div class="estado"><h2>Não deu pra carregar</h2><p>' + esc(msg) +
    '</p><p style="margin-top:8px">Tenta de novo no botão Atualizar. Se continuar, avisa o Joca ou a Julia.</p></div>';
  document.getElementById('atualizado').textContent = 'Sem conexão com a planilha';
}

function pedirPin(erro) {
  document.getElementById('dias').innerHTML = '';
  document.getElementById('atualizado').textContent = 'Acesso da equipe';
  document.getElementById('conteudo').innerHTML =
    '<form class="pin" id="formPin"><h2>Digite o PIN da equipe</h2>' +
    '<input id="campoPin" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">' +
    '<div class="erro">' + (erro ? 'PIN errado. Tenta de novo.' : '') + '</div>' +
    '<button type="submit">Entrar</button></form>';
  var campo = document.getElementById('campoPin');
  campo.focus();
  document.getElementById('formPin').addEventListener('submit', function (e) {
    e.preventDefault();
    guardar('nomades-pin', campo.value.trim());
    carregar();
  });
}

function receber(dados) {
  var btn = document.getElementById('btnAtualizar');
  btn.disabled = false; btn.classList.remove('girando');
  if (dados && dados.erro === 'PIN') { apagar('nomades-pin'); pedirPin(ler('nomades-pin-tentou') === '1'); guardar('nomades-pin-tentou', '1'); return; }
  apagar('nomades-pin-tentou');
  if (dados.erro) { mostrarErro(dados.mensagem || dados.erro); return; }
  if (dados.imoveis) IMOVEIS = dados.imoveis;
  DADOS_HOJE = dados.hoje;
  try { renderizar(dados); } catch (e) { mostrarErro(e.message); }
}

function carregar() {
  var btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.classList.add('girando');

  if (!PREVIA_LOCAL) {
    // text/plain evita a checagem extra de CORS; o Apps Script lê o corpo cru.
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: ler('nomades-pin') || '' }) })
      .then(function (r) { if (!r.ok) throw new Error('Servidor respondeu ' + r.status); return r.json(); })
      .then(receber)
      .catch(function (e) { btn.disabled = false; btn.classList.remove('girando'); mostrarErro(e && e.message || String(e)); });
    return;
  }

  // Prévia no computador (localhost): usa dados de exemplo.
  var s = document.createElement('script');
  s.src = 'amostra.js';
  s.onload = function () {
    document.getElementById('avisoAmostra').innerHTML =
      '<div class="aviso-amostra">Prévia com dados de exemplo — no link publicado, os dados vêm da planilha.</div>';
    setTimeout(function () { receber(window.AMOSTRA()); }, 300);
  };
  s.onerror = function () { mostrarErro('Arquivo de exemplo não encontrado.'); };
  document.body.appendChild(s);
}

document.getElementById('btnAtualizar').addEventListener('click', carregar);
carregar();
</script>
